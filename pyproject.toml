[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moss"
version = "0.1.0"
description = "Small local coding agent for DeepSeek, OpenAI-compatible, Anthropic-compatible, and Ollama models"
readme = "README.md"
license = {text = "MIT"}
authors = [{ name = "darkgreen", email = "darkgreendkh@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["agent", "llm", "cli", "coding-assistant"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/darkgreendkh/moss-code"
Issues = "https://github.com/darkgreendkh/moss-code/issues"

[project.scripts]
moss = "moss.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["moss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# 显式钉住规则集。CI 里 ruff 是不带版本装的，而 ruff 0.16 扩大了默认 select
# （新增 I/BLE/SIM/DTZ/RUF... 一大批），一次上游发版就让 CI 冒出 100+ 条从没
# 打算开启的告警、整个 Lint step 直接红。写死成本项目一直在用的那四组，
# 升 ruff 不再改变判定标准；真要加规则也得是这里显式加。
select = ["E4", "E7", "E9", "F"]
