name: Manual and weekly evaluation gates

on:
  workflow_dispatch:
    inputs:
      level:
        description: Evaluation level to validate
        required: true
        default: L2
        type: choice
        options: [L2, L3]
  schedule:
    - cron: "17 3 * * 1"

jobs:
  l2-l3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff
      - name: Evaluation framework gates
        run: |
          ruff check moss tests scripts
          python scripts/eval_lint_tasks.py benchmarks/tasks/mined
          python -m pytest tests/test_ablations.py tests/test_memory_ablation_guard.py tests/test_verifier.py -q
      - name: Record requested tier
        run: echo "requested_level=${{ inputs.level || 'L2+L3 weekly' }}" >> "$GITHUB_STEP_SUMMARY"
